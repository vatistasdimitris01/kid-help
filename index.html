<!doctype html>
<html lang="el">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc"><meta name="description" content="A simple Greek and English communication board for children.">
<title>Μιλάω • I Can Say It</title>
<style>
:root{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24334a;background:#f6f8fc;font-synthesis:none;text-rendering:optimizeLegibility;--ink:#24334a;--muted:#738198;--green:#58c58a;--blue:#5488e8;--yellow:#ffca55;--pink:#f28eb0;--line:#e5eaf2}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 10% 0%,#eaf4ff 0,transparent 38%),#f6f8fc}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #7aa9ff;outline-offset:3px}.app{max-width:1180px;margin:auto;padding:clamp(12px,2.5vw,28px);min-height:100dvh;display:flex;flex-direction:column;gap:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;background:#e4f7ed;display:grid;place-items:center;font-size:27px;box-shadow:0 3px 0 #c4ead4}.brand h1{font-size:clamp(18px,3vw,24px);margin:0;font-weight:900;letter-spacing:-.6px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px;font-weight:650}.top-actions{display:flex;gap:8px;align-items:center}.pill{border:1px solid var(--line);background:white;border-radius:14px;padding:10px 13px;font-weight:800;color:var(--ink);box-shadow:0 2px 0 #e7ebf2}.pill.active{background:#e9f1ff;border-color:#cbdcff;color:#315eae}.hero{background:white;border:1px solid var(--line);border-radius:23px;padding:16px 18px;box-shadow:0 4px 0 #e9edf4}.hero-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.hero h2{margin:0;font-size:clamp(17px,2.8vw,22px);letter-spacing:-.4px}.hint{color:var(--muted);font-size:13px;font-weight:600;margin:5px 0 0}.sentence{display:flex;align-items:center;gap:8px;min-height:66px;overflow-x:auto;padding:12px 2px 5px;scrollbar-width:thin}.empty{color:#9aa6b7;font-weight:650;font-size:14px;white-space:nowrap}.word-chip{flex:0 0 auto;border:2px solid #d8e7ff;background:#f0f6ff;border-radius:14px;padding:9px 12px;font-size:17px;font-weight:850;color:#315eae;display:flex;gap:7px;align-items:center}.word-chip small{font-size:10px;opacity:.6}.sentence-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.action{border:0;border-radius:14px;padding:12px 16px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px}.speak{background:var(--green);color:#123e2a;box-shadow:0 4px 0 #3da96f;flex:1}.clear{background:#f0f2f6;color:#647187}.back{background:#fff1d7;color:#78510a}.board{display:flex;flex-direction:column;gap:12px;flex:1}.categories{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 7px;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}.cat{border:1px solid var(--line);background:white;border-radius:15px;padding:10px 14px;white-space:nowrap;font-weight:850;color:#58677d;box-shadow:0 2px 0 #e8ecf3}.cat[aria-pressed=true]{background:#eaf2ff;color:#315eae;border-color:#c9dcff;box-shadow:0 2px 0 #c9dcff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:11px;align-content:start}.tile{position:relative;border:1px solid var(--line);border-radius:19px;background:white;min-height:124px;padding:14px 9px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 #e8ecf3;transition:transform .12s,box-shadow .12s;min-width:0}.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #e8ecf3}.tile .emoji{font-size:clamp(31px,5vw,42px);line-height:1}.tile .word{font-size:clamp(14px,2vw,17px);font-weight:900;text-align:center;overflow-wrap:anywhere}.tile .sub{font-size:11px;color:#8995a7;font-weight:650}.tile.green{background:#f0fbf4;border-color:#d9f1e1}.tile.blue{background:#f1f6ff;border-color:#dce8ff}.tile.yellow{background:#fff9e9;border-color:#f8ebc6}.tile.pink{background:#fff3f7;border-color:#f8dfe9}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#8a96a8;font-size:11px;font-weight:650;padding:2px 3px}.custom-row{display:flex;gap:8px}.custom-row input{min-width:0;flex:1;border:1px solid var(--line);border-radius:13px;padding:12px;background:white;color:var(--ink)}.custom-row button{border:0;border-radius:13px;background:#e8f5ed;color:#286344;font-weight:900;padding:0 15px}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#26354c;color:white;padding:11px 16px;border-radius:14px;font-size:13px;font-weight:750;opacity:0;pointer-events:none;transition:.2s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:760px){.app{gap:19px}.hero{padding:18px 22px}.grid{grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:13px}.tile{min-height:138px}}
@media(orientation:landscape) and (max-height:600px){.app{padding:10px 18px;gap:9px}.top{min-height:42px}.logo{width:38px;height:38px}.hero{padding:9px 14px}.sentence{min-height:48px;padding:6px 2px}.sentence-actions{margin-top:4px}.action{min-height:38px;padding:8px 13px}.board{gap:7px}.categories{padding-bottom:3px}.grid{grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}.tile{min-height:94px;padding:8px}.tile .emoji{font-size:30px}.bottom{display:none}}
@media(max-width:430px){.app{padding:11px;gap:12px}.brand p{display:none}.top-actions .pill{padding:9px 10px}.hero{padding:13px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tile{min-height:108px;border-radius:16px;padding:10px 5px}.tile .emoji{font-size:31px}.tile .word{font-size:13px}.sentence-actions .action{padding:10px 11px;font-size:13px}.categories{margin-right:-11px}}
@media(max-width:350px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top-actions{gap:5px}.pill{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><div class="logo" aria-hidden="true">💬</div><div><h1>Μιλάω <span style="color:#9aa6b7">•</span> I Can Say It</h1><p>Οι λέξεις μου, η φωνή μου • My words, my voice</p></div></div><div class="top-actions"><button class="pill active" id="greek" aria-pressed="true">🇬🇷 EL</button><button class="pill" id="english" aria-pressed="false">🇬🇧 EN</button></div></header>
<section class="hero" aria-label="Sentence builder"><div class="hero-head"><div><h2 id="sentenceTitle">Η πρότασή μου</h2><p class="hint" id="hint">Πάτησε τις εικόνες για να φτιάξεις μια πρόταση.</p></div><span aria-hidden="true" style="font-size:27px">✨</span></div><div class="sentence" id="sentence" aria-live="polite"><span class="empty" id="empty">Οι λέξεις σου θα εμφανιστούν εδώ…</span></div><div class="sentence-actions"><button class="action speak" id="speak">🔊 <span id="speakLabel">Διάβασέ το</span></button><button class="action back" id="undo" title="Undo">↶ <span id="undoLabel">Πίσω</span></button><button class="action clear" id="clear">✕ <span id="clearLabel">Καθαρισμός</span></button></div></section>
<section class="board"><nav class="categories" id="categories" aria-label="Categories"></nav><div class="grid" id="grid" aria-label="Communication words"></div><div class="custom-row"><label class="sr" for="custom" id="customLabel">Προσθήκη δικής μου λέξης</label><input id="custom" maxlength="40" autocomplete="off" placeholder="Γράψε μια λέξη…"><button id="addCustom">＋</button></div></section>
<footer class="bottom"><span id="footerText">Κάθε λέξη μετράει 💚</span><span>🔒 <span id="privacy">Χωρίς λογαριασμό • Χωρίς αποθήκευση</span></span></footer>
</main><div class="toast" id="toast" role="status"></div>
<script>
const words=[
{cat:"people",e:"👩",el:"Εγώ",en:"I",color:"blue"},{cat:"people",e:"👨",el:"Εσύ",en:"You",color:"blue"},{cat:"people",e:"👩‍👧",el:"Μαμά",en:"Mum",color:"pink"},{cat:"people",e:"👨‍👦",el:"Μπαμπάς",en:"Dad",color:"blue"},{cat:"people",e:"👩‍🏫",el:"Δασκάλα",en:"Teacher",color:"yellow"},{cat:"people",e:"🧒",el:"Φίλος",en:"Friend",color:"green"},
{cat:"feelings",e:"😊",el:"Χαρούμενος",en:"Happy",color:"yellow"},{cat:"feelings",e:"😢",el:"Λυπημένος",en:"Sad",color:"blue"},{cat:"feelings",e:"😠",el:"Θυμωμένος",en:"Angry",color:"pink"},{cat:"feelings",e:"😴",el:"Κουρασμένος",en:"Tired",color:"blue"},{cat:"feelings",e:"😨",el:"Φοβάμαι",en:"Scared",color:"pink"},{cat:"feelings",e:"🥰",el:"Αγαπώ",en:"Love",color:"pink"},
{cat:"needs",e:"💧",el:"Νερό",en:"Water",color:"blue"},{cat:"needs",e:"🍎",el:"Φαγητό",en:"Food",color:"green"},{cat:"needs",e:"🚽",el:"Τουαλέτα",en:"Toilet",color:"yellow"},{cat:"needs",e:"🛏️",el:"Κρεβάτι",en:"Bed",color:"blue"},{cat:"needs",e:"🧥",el:"Ζακέτα",en:"Jacket",color:"yellow"},{cat:"needs",e:"🧸",el:"Το παιχνίδι μου",en:"My toy",color:"pink"},
{cat:"actions",e:"🙏",el:"Θέλω",en:"I want",color:"green"},{cat:"actions",e:"🛑",el:"Σταμάτα",en:"Stop",color:"pink"},{cat:"actions",e:"🆘",el:"Βοήθεια",en:"Help",color:"yellow"},{cat:"actions",e:"🚶",el:"Πάμε",en:"Let's go",color:"green"},{cat:"actions",e:"🎮",el:"Παίζω",en:"Play",color:"blue"},{cat:"actions",e:"🫂",el:"Αγκαλιά",en:"Hug",color:"pink"},
{cat:"places",e:"🏠",el:"Σπίτι",en:"Home",color:"yellow"},{cat:"places",e:"🏫",el:"Σχολείο",en:"School",color:"blue"},{cat:"places",e:"🌳",el:"Πάρκο",en:"Park",color:"green"},{cat:"places",e:"🚗",el:"Αυτοκίνητο",en:"Car",color:"yellow"},
{cat:"yesno",e:"✅",el:"Ναι",en:"Yes",color:"green"},{cat:"yesno",e:"❌",el:"Όχι",en:"No",color:"pink"},{cat:"yesno",e:"🤷",el:"Δεν ξέρω",en:"I don't know",color:"yellow"},{cat:"yesno",e:"💗",el:"Παρακαλώ",en:"Please",color:"pink"},{cat:"yesno",e:"🙏",el:"Ευχαριστώ",en:"Thank you",color:"green"}
];
const cats=[{id:"all",e:"⭐",el:"Όλα",en:"All"},{id:"people",e:"👥",el:"Άνθρωποι",en:"People"},{id:"needs",e:"🍎",el:"Ανάγκες",en:"Needs"},{id:"actions",e:"⚡",el:"Ρήματα",en:"Actions"},{id:"feelings",e:"💛",el:"Συναισθήματα",en:"Feelings"},{id:"places",e:"📍",el:"Μέρη",en:"Places"},{id:"yesno",e:"💬",el:"Ναι / Όχι",en:"Yes / No"}];
const ui={el:{sentence:"Η πρότασή μου",hint:"Πάτησε τις εικόνες για να φτιάξεις μια πρόταση.",empty:"Οι λέξεις σου θα εμφανιστούν εδώ…",speak:"Διάβασέ το",undo:"Πίσω",clear:"Καθαρισμός",custom:"Γράψε μια λέξη…",add:"Προσθήκη",footer:"Κάθε λέξη μετράει 💚",privacy:"Χωρίς λογαριασμό • Χωρίς αποθήκευση",nothing:"Πρόσθεσε πρώτα μερικές λέξεις.",added:"Η λέξη προστέθηκε!",cats:{all:"Όλα",people:"Άνθρωποι",needs:"Ανάγκες",actions:"Ρήματα",feelings:"Συναισθήματα",places:"Μέρη",yesno:"Ναι / Όχι"}},en:{sentence:"My sentence",hint:"Tap the pictures to build a sentence.",empty:"Your words will appear here…",speak:"Read it aloud",undo:"Undo",clear:"Clear",custom:"Type a word…",add:"Add",footer:"Every word matters 💚",privacy:"No account • Nothing saved",nothing:"Add some words first.",added:"Word added!",cats:{all:"All",people:"People",needs:"Needs",actions:"Actions",feelings:"Feelings",places:"Places",yesno:"Yes / No"}}};
let lang="el",active="all",sentence=[],lastUtterance=null;
const $=id=>document.getElementById(id);
function render(){const t=ui[lang];$("sentenceTitle").textContent=t.sentence;$("hint").textContent=t.hint;$("empty").textContent=t.empty;$("speakLabel").textContent=t.speak;$("undoLabel").textContent=t.undo;$("clearLabel").textContent=t.clear;$("custom").placeholder=t.custom;$("customLabel").textContent=t.add;$("addCustom").setAttribute("aria-label",t.add);$("footerText").textContent=t.footer;$("privacy").textContent=t.privacy;
$("greek").classList.toggle("active",lang==="el");$("english").classList.toggle("active",lang==="en");$("greek").setAttribute("aria-pressed",lang==="el");$("english").setAttribute("aria-pressed",lang==="en");
$("categories").innerHTML=cats.map(c=>'<button class="cat" data-cat="'+c.id+'" aria-pressed="'+(active===c.id)+'">'+c.e+' '+t.cats[c.id]+'</button>').join("");
$("grid").innerHTML=words.filter(w=>active==="all"||w.cat===active).map((w,i)=>'<button class="tile '+w.color+'" data-word="'+words.indexOf(w)+'"><span class="emoji" aria-hidden="true">'+w.e+'</span><span class="word">'+w[lang]+'</span><span class="sub">'+(lang==="el"?w.en:w.el)+'</span></button>').join("");
$("sentence").innerHTML=sentence.length?sentence.map((w,i)=>'<button class="word-chip" data-remove="'+i+'" aria-label="'+(lang==="el"?"Αφαίρεση":"Remove")+' '+w[lang]+'">'+w.e+' '+w[lang]+' <small>×</small></button>').join(""):'<span class="empty">'+t.empty+'</span>';
}
function toast(s){const el=$("toast");el.textContent=s;el.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove("show"),1800)}
function addWord(w){if(sentence.length>=18){toast(lang==="el"?"Η πρόταση είναι αρκετά μεγάλη!":"Sentence is long enough!");return}sentence.push(w);render()}
function speak(){if(!sentence.length){toast(ui[lang].nothing);return}if(!("speechSynthesis"in window)){toast(lang==="el"?"Η εκφώνηση δεν υποστηρίζεται σε αυτή τη συσκευή.":"Speech is not supported on this device.");return}speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(sentence.map(w=>w[lang]).join(" "));utter.lang=lang==="el"?"el-GR":"en-US";utter.rate=.88;utter.pitch=1.05;lastUtterance=utter;speechSynthesis.speak(utter)}
$("greek").onclick=()=>{lang="el";render()};$("english").onclick=()=>{lang="en";render()};$("categories").onclick=e=>{const b=e.target.closest("[data-cat]");if(b){active=b.dataset.cat;render()}};$("grid").onclick=e=>{const b=e.target.closest("[data-word]");if(b)addWord(words[Number(b.dataset.word)])};$("sentence").onclick=e=>{const b=e.target.closest("[data-remove]");if(b){sentence.splice(Number(b.dataset.remove),1);render()}};
$("speak").onclick=speak;$("clear").onclick=()=>{sentence=[];if("speechSynthesis"in window)speechSynthesis.cancel();render()};$("undo").onclick=()=>{sentence.pop();render()};
function addCustom(){const v=$("custom").value.trim();if(!v)return;addWord({e:"💬",el:lang==="el"?v:v,en:lang==="en"?v:v,color:"blue"});$("custom").value=""}
$("addCustom").onclick=addCustom;$("custom").addEventListener("keydown",e=>{if(e.key==="Enter")addCustom()});
if(!("speechSynthesis"in window))$("speak").title="Speech synthesis is not available in this browser.";
render();
</script></body></html>
